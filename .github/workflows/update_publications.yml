name: Update Academic and Talks Data

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-academic-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch publications, profile, talks, Scholar metrics, Medium articles
        run: |
          python scripts/fetch_publications.py
          python scripts/sync_arxiv_publications.py
          python scripts/fetch_orcid_profile.py
          python scripts/fetch_talks.py
          python scripts/fetch_scholar_metrics.py
          python scripts/fetch_medium_articles.py

      - name: Fetch per-paper citation metrics (OpenAlex)
        run: python scripts/fetch_paper_metrics.py

      - name: Fetch project engagement metrics (GitHub, Zenodo, HuggingFace)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_project_metrics.py

      - name: Regenerate BibTeX, CV TeX, activity feed, and RSS feed
        run: |
          python scripts/update_publications_bib.py
          python scripts/update_cv_tex.py
          python scripts/generate_activity.py
          python scripts/generate_rss.py

      - name: Verify tool sync and site governance rules
        run: |
          python scripts/check_tools_sync.py
          python scripts/verify_site.py --ci

      - name: Compile LaTeX CV (EN)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: data/cv.tex
          extra_system_packages: "biber"

      - name: Compile LaTeX CV (DE)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: data/cv_de.tex
          extra_system_packages: "biber"

      - name: Deploy CV PDFs to public directory
        run: |
          cp data/cv.pdf public/cv.pdf
          cp data/cv_de.pdf public/cv_de.pdf

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- data/publications.json data/orcid_profile.json data/talks.json data/scholar_metrics.json data/medium_articles.json data/paper_metrics.json data/project_metrics.json data/activity.json data/publications.bib data/cv_data.json data/cv.tex data/cv_de.tex data/cv.pdf data/cv_de.pdf public/cv.pdf public/cv_de.pdf public/feed.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push data files
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json data/orcid_profile.json data/talks.json data/scholar_metrics.json data/medium_articles.json data/paper_metrics.json data/project_metrics.json data/activity.json data/publications.bib data/cv_data.json data/cv.tex data/cv_de.tex data/cv.pdf data/cv_de.pdf public/cv.pdf public/cv_de.pdf public/feed.xml
          git commit -m "chore: update academic data, metrics, activity feed, RSS, and CV PDFs"
          git pull --rebase origin main
          git push
